name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# onnxruntime-node 1.21.0's postinstall fetches a CUDA tarball from
# github.com/microsoft/onnxruntime/releases/tag/v1.21.0, which 404s now that
# the release is gone upstream. CI has no GPU and the package ships the CPU
# binaries, so skip the download (drop this when a newer onnxruntime-node lands).
env:
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npx prettier --check .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
